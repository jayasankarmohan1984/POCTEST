trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_WORKING_DIR: '$(System.DefaultWorkingDirectory)'

stages:

# ─── STAGE 1: Validate ────────────────────────────────────────────
- stage: Validate
  displayName: 'Terraform Validate'
  jobs:
  - job: validate
    displayName: 'Validate'
    steps:
    - checkout: self

    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        terraform init \
          -backend-config="resource_group_name=rg-tfstate" \
          -backend-config="storage_account_name=tfstateaccountpoc" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate" \
          -upgrade
      displayName: 'Terraform Init'
      workingDirectory: '$(TF_WORKING_DIR)'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_USE_OIDC: true

    - script: terraform validate
      displayName: 'Terraform Validate'
      workingDirectory: '$(TF_WORKING_DIR)'

# ─── STAGE 2: Plan ────────────────────────────────────────────────
- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Validate
  jobs:
  - job: plan
    displayName: 'Plan'
    steps:
    - checkout: self

    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        terraform init \
          -backend-config="resource_group_name=rg-tfstate" \
          -backend-config="storage_account_name=tfstateaccountpoc" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate"
      displayName: 'Terraform Init'
      workingDirectory: '$(TF_WORKING_DIR)'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_USE_OIDC: true

    - script: terraform plan -out=tfplan
      displayName: 'Terraform Plan'
      workingDirectory: '$(TF_WORKING_DIR)'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_USE_OIDC: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Plan Artifact'
      inputs:
        targetPath: '$(TF_WORKING_DIR)/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

# ─── STAGE 3: Apply ───────────────────────────────────────────────
- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  jobs:
  - deployment: apply
    displayName: 'Apply'
    environment: 'hub-default'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Plan Artifact'
            inputs:
              artifact: 'tfplan'
              path: '$(TF_WORKING_DIR)'

          - script: |
              terraform init \
                -backend-config="resource_group_name=rg-tfstate" \
                -backend-config="storage_account_name=tfstateaccountpoc" \
                -backend-config="container_name=tfstate" \
                -backend-config="key=terraform.tfstate"
            displayName: 'Terraform Init'
            workingDirectory: '$(TF_WORKING_DIR)'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_USE_OIDC: true

          - script: terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'
            workingDirectory: '$(TF_WORKING_DIR)'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_USE_OIDC: true

# ─── STAGE 4: Drift Detection ─────────────────────────────────────
- stage: Drift
  displayName: 'Drift Detection'
  dependsOn: Apply
  jobs:
  - job: drift
    displayName: 'Drift Detection'
    steps:
    - checkout: self

    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        terraform init \
          -backend-config="resource_group_name=rg-tfstate" \
          -backend-config="storage_account_name=tfstateaccountpoc" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate"
      displayName: 'Terraform Init'
      workingDirectory: '$(TF_WORKING_DIR)'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_USE_OIDC: true

    - script: |
        terraform plan -detailed-exitcode
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "##[section]✅ No drift detected"
        elif [ $EXIT_CODE -eq 2 ]; then
          echo "##[warning]⚠️ Drift detected! Infrastructure has changed."
          exit 1
        else
          echo "##[error]❌ Terraform plan failed"
          exit 1
        fi
      displayName: 'Terraform Drift Detection'
      workingDirectory: '$(TF_WORKING_DIR)'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_USE_OIDC: true