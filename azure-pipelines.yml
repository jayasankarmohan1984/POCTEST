trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_WORKING_DIR: '$(System.DefaultWorkingDirectory)'
  STORAGE_ACCOUNT: 'tfstateaccountpoc'
  CONTAINER_NAME: 'tfstate'
  BLOB_NAME: 'terraform.tfstate'

stages:

# ─── STAGE 1: Validate ────────────────────────────────────────────
- stage: Validate
  displayName: 'Terraform Validate'
  jobs:
  - job: validate
    displayName: 'Validate'
    steps:
    - checkout: self

    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Break State Lock (if exists)'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Checking and breaking state lock if exists..."
          az storage blob lease break \
            --account-name $(STORAGE_ACCOUNT) \
            --container-name $(CONTAINER_NAME) \
            --blob-name $(BLOB_NAME) \
            --auth-mode login 2>/dev/null || echo "No lock to break - continuing..."

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(TF_WORKING_DIR)'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken
          terraform init -upgrade \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=tfstateaccountpoc" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(TF_WORKING_DIR)'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken
          terraform validate

# ─── STAGE 2: Plan ────────────────────────────────────────────────
- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Validate
  jobs:
  - job: plan
    displayName: 'Plan'
    steps:
    - checkout: self

    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Break State Lock (if exists)'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Checking and breaking state lock if exists..."
          az storage blob lease break \
            --account-name $(STORAGE_ACCOUNT) \
            --container-name $(CONTAINER_NAME) \
            --blob-name $(BLOB_NAME) \
            --auth-mode login 2>/dev/null || echo "No lock to break - continuing..."

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(TF_WORKING_DIR)'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken
          terraform init -upgrade \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=tfstateaccountpoc" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(TF_WORKING_DIR)'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken
          terraform plan -out=tfplan -lock=false \
            -var-file="terraform.tfvars" \
            -var="win_admin_password=$(WIN_ADMIN_PASSWORD)" \
            -var="s2s_shared_key=$(S2S_SHARED_KEY)"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Plan Artifact'
      inputs:
        targetPath: '$(TF_WORKING_DIR)/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

# ─── STAGE 3: Apply ───────────────────────────────────────────────
- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  jobs:
  - deployment: apply
    displayName: 'Apply'
    environment: 'hub-default'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: 'Break State Lock (if exists)'
            inputs:
              azureSubscription: 'SCN-TFM-HUB'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Checking and breaking state lock if exists..."
                az storage blob lease break \
                  --account-name $(STORAGE_ACCOUNT) \
                  --container-name $(CONTAINER_NAME) \
                  --blob-name $(BLOB_NAME) \
                  --auth-mode login 2>/dev/null || echo "No lock to break - continuing..."

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Plan Artifact'
            inputs:
              artifact: 'tfplan'
              path: '$(TF_WORKING_DIR)'

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: 'SCN-TFM-HUB'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(TF_WORKING_DIR)'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN=$idToken
                terraform init -upgrade \
                  -backend-config="resource_group_name=rg-tfstate" \
                  -backend-config="storage_account_name=tfstateaccountpoc" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=terraform.tfstate"

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: 'SCN-TFM-HUB'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(TF_WORKING_DIR)'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN=$idToken
                terraform apply -auto-approve tfplan

# ─── STAGE 4: Drift Detection ─────────────────────────────────────
- stage: Drift
  displayName: 'Drift Detection'
  dependsOn: Apply
  jobs:
  - job: drift
    displayName: 'Drift Detection'
    steps:
    - checkout: self

    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Break State Lock (if exists)'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Checking and breaking state lock if exists..."
          az storage blob lease break \
            --account-name $(STORAGE_ACCOUNT) \
            --container-name $(CONTAINER_NAME) \
            --blob-name $(BLOB_NAME) \
            --auth-mode login 2>/dev/null || echo "No lock to break - continuing..."

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(TF_WORKING_DIR)'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken
          terraform init -upgrade \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=tfstateaccountpoc" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"

    - task: AzureCLI@2
      displayName: 'Terraform Drift Detection'
      inputs:
        azureSubscription: 'SCN-TFM-HUB'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(TF_WORKING_DIR)'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken
          terraform plan -detailed-exitcode -lock=false \
            -var-file="terraform.tfvars" \
            -var="win_admin_password=$(WIN_ADMIN_PASSWORD)" \
            -var="s2s_shared_key=$(S2S_SHARED_KEY)"
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "##[section]✅ No drift detected"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "##[warning]⚠️ Drift detected! Infrastructure has changed."
            exit 1
          else
            echo "##[error]❌ Terraform plan failed"
            exit 1
          fi