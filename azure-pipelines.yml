trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_WORKING_DIR: '$(System.DefaultWorkingDirectory)'

stages:
- stage: Validate
  jobs:
  - job: validate
    displayName: 'Terraform Validate'
    steps:
    - task: TerraformInstaller@0
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV1@0
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(TF_WORKING_DIR)'
        backendServiceArm: 'SCN-TFM-HUB'
        backendAzureRmResourceGroupName: 'rg-tfstate'
        backendAzureRmStorageAccountName: 'tfstateaccountpoc'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTaskV1@0
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(TF_WORKING_DIR)'

- stage: Plan
  jobs:
  - job: plan
    displayName: 'Terraform Plan'
    steps:
    - task: TerraformTaskV1@0
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(TF_WORKING_DIR)'
        environmentServiceNameAzureRM: 'SCN-TFM-HUB'

- stage: Apply
  jobs:
  - deployment: apply
    displayName: 'Terraform Apply'
    environment: 'hub-default'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformTaskV1@0
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(TF_WORKING_DIR)'
              environmentServiceNameAzureRM: 'SCN-TFM-HUB'
              commandOptions: '-auto-approve'

- stage: Drift
  jobs:
  - job: drift
    displayName: 'Terraform Drift Detection'
    steps:
    - task: TerraformTaskV1@0
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(TF_WORKING_DIR)'
        environmentServiceNameAzureRM: 'SCN-TFM-HUB'
        commandOptions: '-detailed-exitcode'
